[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wonderful-digital-world"
version = "0.1.0"
description = "Reference contracts for a human-centered persistent computational environment"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Wonderful Digital World contributors"}]
dependencies = []

[tool.setuptools.packages.find]
where = ["packages"]
include = ["wdw_*"]

[tool.pytest.ini_options]
pythonpath = ["packages"]
testpaths = ["tests"]
